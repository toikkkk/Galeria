# ============================================================================
# GALERIA — Konfigurasi export ml-digital-art-identity/
# ----------------------------------------------------------------------------
# Beda dari ml-visual-search/configs/config.yaml: training kedua model di sini
# dikerjakan di notebook (model_devArt.ipynb / model_devAI.ipynb), bukan lewat
# script src/train.py -- jadi file ini HANYA menyimpan parameter yang dipakai
# `src/export.py` (checkpoint .pth -> ONNX siap-pakai backend/). JANGAN
# hardcode angka-angka di bawah ini di kode; baca dari sini.
#
# Nilai image size / mean-std / threshold di file ini di-copy PERSIS dari sel
# notebook masing-masing model -- lihat komentar tiap key untuk sumbernya.
# Kalau notebook di-retrain ulang dengan parameter beda, update file ini juga.
# ============================================================================

# --------------------------------------------------------------- art_to_art ---
# Sumber: notebooks/Similarity image Art to Art/model_devArt.ipynb
art_to_art:
  checkpoint: "notebooks/Similarity image Art to Art/model/best_siamese_convnext.pth"
  backbone: "convnext_tiny"     # models.convnext_tiny(weights=IMAGENET1K_V1)
  embedding_dim: 512

  image:
    # eval_transforms notebook: Resize(256,256, BICUBIC) -> CenterCrop(224)
    resize: 256
    size: 224
    interpolation: "bicubic"
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Jarak Euclidean (F.pairwise_distance) antar embedding L2-normalized --
  # BUKAN cosine seperti karya_embeddings Visual Search. Dua nilai berbeda
  # muncul di notebook:
  #   - 0.4315 -> hasil kalibrasi ROC/Youden's J statistic di val set
  #     (threshold "matematis optimal", tapi lebih longgar).
  #   - 0.10   -> "EMPIRICAL_THRESHOLD" dipakai di demo GaleriaSimilarityEngine,
  #     jauh lebih ketat (presisi tinggi, minim false-positive "duplikat").
  # Dipilih 0.10 sebagai default produksi -- salah blokir karya asli (false
  # positive) jauh lebih merugikan reputasi seniman drpd sesekali kelewatan
  # duplikat asli (false negative bisa ditangkap ulang lewat manual review).
  # TETAP direview ulang begitu ada lebih banyak data verifikasi nyata.
  distance_threshold: 0.10

  export:
    onnx_path: "export/art_to_art.onnx"
    onnx_opset: 17
    model_version: "siamese_convnext_v1"   # dicatat di karya_fingerprints.model_version_arttoart

# ---------------------------------------------------------------- art_to_ai ---
# Sumber: notebooks/similarity image AI/model_devAI.ipynb
art_to_ai:
  checkpoint: "notebooks/similarity image AI/model/convnext_ai_detector.pth"
  backbone: "convnext_tiny"     # models.convnext_tiny(weights=IMAGENET1K_V1), classifier[2] -> Linear(in_features, 1)

  image:
    # Albumentations pipeline notebook: Resize(320,320) langsung (TANPA crop) -> Normalize
    size: 320
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Output notebook: logit tunggal -> sigmoid -> P(AI-generated). Label
  # training: 0 = REAL, 1 = AI (lihat df['Label']). Threshold 0.5 = cutoff
  # standar yang dipakai saat evaluasi training (`torch.sigmoid(outputs) > 0.5`).
  probability_threshold: 0.5

  export:
    onnx_path: "export/art_to_ai.onnx"
    onnx_opset: 17
    model_version: "convnext_ai_detector_v1"   # dicatat di karya_fingerprints.model_version_arttoai

# ------------------------------------------------------------------- phash ---
# imagehash.phash() default (hash_size=8 -> 64-bit hash), dipakai notebook
# Art-to-Art untuk fingerprint cepat (lihat cell "phash_val = str(imagehash.phash(img))").
# CATATAN JUJUR: threshold di bawah BELUM dikalibrasi lewat ROC/dataset
# berlabel seperti distance_threshold art_to_art -- ini angka acuan umum di
# literatur perceptual hashing (<=5 bit dari 64 bit dianggap "hampir pasti
# gambar yang sama/kompresi ulang"). Revisit begitu ada data verifikasi nyata
# untuk dikalibrasi lebih presisi.
phash:
  hamming_threshold: 5
