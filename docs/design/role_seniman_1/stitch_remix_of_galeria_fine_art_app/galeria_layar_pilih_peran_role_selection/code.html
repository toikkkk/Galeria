<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALERIA - Pilih Peran (Role Selection)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"EB Garamond"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              bg: '#FAF8F5',
              surface: '#FFFFFF',
              dark: '#1C1C1C',
              gold: '#C9A227',
              goldLight: '#FDF8E9',
              muted: '#8A8580',
              border: '#E8E4DF',
              cardBg: '#F7F5F0'
            }
          },
          boxShadow: {
            'subtle': '0 4px 20px -2px rgba(28, 28, 28, 0.05)',
            'card-selected': '0 8px 30px -4px rgba(201, 162, 39, 0.12)',
            'button': '0 4px 14px rgba(28, 28, 28, 0.15)'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF8F5;
      color: #1C1C1C;
      -webkit-font-smoothing: antialiased;
    }
    .role-card {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-brand-bg min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-brand-gold/20 selection:text-brand-dark">

  <div class="w-full max-w-[393px] mx-auto min-h-screen flex flex-col justify-between px-6 pt-5 pb-8 relative">
    
    <!-- Top Navigation Bar -->
    <div>
      <div class="flex items-center justify-between h-11 mb-6">
        <button type="button" aria-label="Kembali" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-brand-dark hover:bg-black/5 active:scale-95 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
          </svg>
        </button>

        <!-- Brand Emblem / Logo & Stepper Indicator -->
        <div class="flex items-center gap-1.5">
          <span class="w-7 h-1 rounded-full bg-brand-gold"></span>
          <span class="w-2 h-1 rounded-full bg-brand-border"></span>
          <span class="w-2 h-1 rounded-full bg-brand-border"></span>
        </div>

        <!-- Salon / Region Badge -->
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-brand-surface border border-brand-border text-[11px] font-medium tracking-wide uppercase text-brand-dark/80 shadow-2xs">
          <span class="w-1.5 h-1.5 rounded-full bg-brand-gold"></span>
          <span>LANGKAH 1/3</span>
        </div>
      </div>

      <!-- Header Section -->
      <div class="space-y-2 mb-7">
        <h1 class="font-serif text-[34px] leading-[1.12] font-medium tracking-tight text-brand-dark">
          Daftar sebagai
        </h1>
        <p class="text-[14px] text-brand-muted leading-relaxed font-normal">
          Kamu bisa mengubah ini nanti
        </p>
      </div>

      <!-- Selectable Cards Stack -->
      <div class="space-y-4">

        <!-- Card 1: Kolektor (Selected by default according to prompt description) -->
        <label id="card-kolektor" class="role-card relative block bg-brand-surface rounded-[20px] p-5 cursor-pointer border-2 border-brand-gold shadow-card-selected overflow-hidden">
          <input type="radio" name="role" value="kolektor" checked="" class="sr-only" onchange="updateSelection()">
          
          <!-- Top Right Selected Check Mark Badge -->
          <div id="check-kolektor" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-brand-gold flex items-center justify-center text-white shadow-xs transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"></path>
            </svg>
          </div>

          <!-- Card Content Layout -->
          <div class="flex items-start gap-4 pr-7">
            <!-- Illustration: Collector / Art Appreciation & Loupe -->
            <div class="w-16 h-16 rounded-2xl bg-brand-goldLight border border-brand-gold/25 flex items-center justify-center shrink-0 p-2">
              <svg class="w-10 h-10 text-brand-gold" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Classical Frame with Pedestal & Eye / Loupe Symbol -->
                <rect x="8" y="7" width="24" height="28" rx="2" stroke="#1C1C1C" stroke-width="2"></rect>
                <rect x="12" y="11" width="16" height="20" rx="1" stroke="#C9A227" stroke-width="1.5" fill="#FAF8F5"></rect>
                <!-- Inner Landscape / Artwork Abstract -->
                <path d="M14 26L18 21L22 24L26 19L27 26H14Z" fill="#C9A227" fill-opacity="0.3" stroke="#C9A227" stroke-width="1"></path>
                <circle cx="23" cy="16" r="1.75" fill="#C9A227"></circle>
                <!-- Collector's Magnifying Glass / Loupe Overlay -->
                <circle cx="29" cy="29" r="8" fill="#FAF8F5" stroke="#1C1C1C" stroke-width="2"></circle>
                <circle cx="29" cy="29" r="5.5" stroke="#C9A227" stroke-width="1.25" stroke-dasharray="2 1.5"></circle>
                <path d="M35 35L42 42" stroke="#1C1C1C" stroke-width="2.5" stroke-linecap="round"></path>
              </svg>
            </div>

            <!-- Title & Description -->
            <div class="space-y-1 pt-0.5">
              <div class="flex items-center gap-2">
                <h2 class="font-serif text-[22px] font-medium text-brand-dark leading-tight tracking-tight">
                  Kolektor
                </h2>
                <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold bg-brand-gold/15 text-brand-gold tracking-wide uppercase">
                  Populer
                </span>
              </div>
              <p class="text-[13.5px] text-brand-muted leading-[1.4] font-normal">
                Jelajahi, beli, dan ikut lelang karya seni asli.
              </p>
            </div>
          </div>

          <!-- Feature micro-tags for context -->
          <div class="mt-4 pt-3 border-t border-brand-border/60 flex items-center gap-3 text-[11.5px] text-brand-dark/70 font-medium">
            <span class="inline-flex items-center gap-1">
              <svg class="w-3.5 h-3.5 text-brand-gold" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
              </svg>
              Sertifikat Keaslian Digital
            </span>
            <span class="text-brand-border">•</span>
            <span>Akses Ruang Lelang VIP</span>
          </div>
        </label>

        <!-- Card 2: Seniman (Unselected state) -->
        <label id="card-seniman" class="role-card relative block bg-brand-surface rounded-[20px] p-5 cursor-pointer border border-brand-border hover:border-brand-dark/25 shadow-subtle overflow-hidden">
          <input type="radio" name="role" value="seniman" class="sr-only" onchange="updateSelection()">
          
          <!-- Top Right Unselected Indicator -->
          <div id="check-seniman" class="absolute top-4 right-4 w-7 h-7 rounded-full border border-brand-border bg-brand-bg flex items-center justify-center text-transparent transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"></path>
            </svg>
          </div>

          <!-- Card Content Layout -->
          <div class="flex items-start gap-4 pr-7">
            <!-- Illustration: Artist / Easel, Palette & Brush -->
            <div class="w-16 h-16 rounded-2xl bg-brand-cardBg border border-brand-border flex items-center justify-center shrink-0 p-2">
              <svg class="w-10 h-10 text-brand-dark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Artist Easel Stand -->
                <path d="M24 7V13M16 42L21 16M32 42L27 16" stroke="#1C1C1C" stroke-width="2" stroke-linecap="round"></path>
                <path d="M12 28H36" stroke="#1C1C1C" stroke-width="2" stroke-linecap="round"></path>
                <!-- Stretched Canvas on Easel -->
                <rect x="14" y="12" width="20" height="15" rx="1.5" fill="#FAF8F5" stroke="#1C1C1C" stroke-width="1.75"></rect>
                <!-- Brush stroke / Art creation on canvas -->
                <path d="M17 19C21 16 27 21 31 17" stroke="#C9A227" stroke-width="2" stroke-linecap="round"></path>
                <!-- Artist Paint Palette in Foreground -->
                <path d="M28 32C28 29.2386 31.5 28 34.5 28C38 28 41 30.5 41 34C41 37.866 37.866 41 34 41C31 41 28 38 28 35.5V32Z" fill="#FAF8F5" stroke="#1C1C1C" stroke-width="1.75"></path>
                <circle cx="33" cy="32" r="1.25" fill="#C9A227"></circle>
                <circle cx="37" cy="34" r="1.25" fill="#1C1C1C"></circle>
                <circle cx="33" cy="37" r="1.25" fill="#C0392B"></circle>
              </svg>
            </div>

            <!-- Title & Description -->
            <div class="space-y-1 pt-0.5">
              <div class="flex items-center gap-2">
                <h2 class="font-serif text-[22px] font-medium text-brand-dark leading-tight tracking-tight">
                  Seniman
                </h2>
                <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold bg-black/5 text-brand-muted tracking-wide uppercase">
                  Kreator
                </span>
              </div>
              <p class="text-[13.5px] text-brand-muted leading-[1.4] font-normal">
                Buka galeri, jual karya, dan buat lelang sendiri.
              </p>
            </div>
          </div>

          <!-- Feature micro-tags for context -->
          <div class="mt-4 pt-3 border-t border-brand-border/60 flex items-center gap-3 text-[11.5px] text-brand-dark/70 font-medium">
            <span class="inline-flex items-center gap-1">
              <svg class="w-3.5 h-3.5 text-brand-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
              </svg>
              Kurasi Karya Instan
            </span>
            <span class="text-brand-border">•</span>
            <span>Royalti &amp; Pembayaran Otomatis</span>
          </div>
        </label>

      </div>
    </div>

    <!-- Pinned Bottom Area -->
    <div class="pt-6 mt-auto">
      <!-- Trust badge footnote -->
      <p class="text-center text-[12px] text-brand-muted mb-4 flex items-center justify-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-brand-gold inline" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"></path>
        </svg>
        <span>Akun dapat dialihkan ke mode lain kapan saja dari profil</span>
      </p>

      <!-- Full-width primary button "Lanjut" pinned at bottom -->
      <button type="button" class="w-full h-12 bg-brand-dark text-white rounded-xl font-medium text-[15px] tracking-wide flex items-center justify-center gap-2 shadow-button hover:bg-black active:scale-[0.99] transition-all">
        <span>Lanjut</span>
        <svg class="w-4 h-4 text-brand-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
        </svg>
      </button>
    </div>

  </div>

  <!-- Selection Script for Interactive Experience -->
  <script>
    function updateSelection() {
      const selected = document.querySelector('input[name="role"]:checked').value;
      const cardKolektor = document.getElementById('card-kolektor');
      const cardSeniman = document.getElementById('card-seniman');
      const checkKolektor = document.getElementById('check-kolektor');
      const checkSeniman = document.getElementById('check-seniman');

      if (selected === 'kolektor') {
        // Kolektor Selected
        cardKolektor.className = "role-card relative block bg-brand-surface rounded-[20px] p-5 cursor-pointer border-2 border-brand-gold shadow-card-selected overflow-hidden";
        checkKolektor.className = "absolute top-4 right-4 w-7 h-7 rounded-full bg-brand-gold flex items-center justify-center text-white shadow-xs transition-all";
        checkKolektor.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>`;

        // Seniman Unselected
        cardSeniman.className = "role-card relative block bg-brand-surface rounded-[20px] p-5 cursor-pointer border border-brand-border hover:border-brand-dark/25 shadow-subtle overflow-hidden";
        checkSeniman.className = "absolute top-4 right-4 w-7 h-7 rounded-full border border-brand-border bg-brand-bg flex items-center justify-center text-transparent transition-all";
        checkSeniman.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>`;
      } else {
        // Seniman Selected
        cardSeniman.className = "role-card relative block bg-brand-surface rounded-[20px] p-5 cursor-pointer border-2 border-brand-gold shadow-card-selected overflow-hidden";
        checkSeniman.className = "absolute top-4 right-4 w-7 h-7 rounded-full bg-brand-gold flex items-center justify-center text-white shadow-xs transition-all";
        checkSeniman.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>`;

        // Kolektor Unselected
        cardKolektor.className = "role-card relative block bg-brand-surface rounded-[20px] p-5 cursor-pointer border border-brand-border hover:border-brand-dark/25 shadow-subtle overflow-hidden";
        checkKolektor.className = "absolute top-4 right-4 w-7 h-7 rounded-full border border-brand-border bg-brand-bg flex items-center justify-center text-transparent transition-all";
        checkKolektor.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>`;
      }
    }
  </script>


</body></html>
