          <!-- Top Right Painting (Landscape) -->
          <div class="h-1/2 relative rounded-lg overflow-hidden shadow-xl ring-1 ring-black/40">

            <div class="absolute inset-0 bg-black/10"></div>
          </div>
        </div>
      </div>

      <!-- Bottom Gradient Overlay on Artwork Collage -->
      <div class="absolute inset-x-0 bottom-0 h-4/5 bg-gradient-to-t from-[#121110] via-[#121110]/80 via-40% to-transparent pointer-events-none"></div>

      <!-- Headline and Supporting Copy positioned over the gradient -->
      <div class="absolute inset-x-0 bottom-0 z-20 px-6 pb-6 text-left">
        <div class="inline-block w-8 h-[2px] bg-[#C9A227] mb-3"></div>
        <h1 class="font-garamond text-3xl sm:text-[34px] leading-[1.18] font-normal text-[#FAF8F5] tracking-tight">
          Temukan dan miliki<br>karya seni asli
        </h1>
        <p class="mt-2 text-sm text-[#DBD6CE] font-normal tracking-wide leading-relaxed line-clamp-2">
          Akses eksklusif lelang dan koleksi terverifikasi dari galeri terkemuka.
        </p>
      </div>

    </div>

    <!-- Bottom Card Area on Off-White Background -->
    <div class="relative w-full flex-1 bg-[#FAF8F5] px-6 pt-5 pb-8 flex flex-col justify-between border-t border-[#EAE6DF] shadow-[0_-12px_30px_rgba(0,0,0,0.06)] rounded-t-[20px] -mt-3 z-30">
      
      <!-- Action Buttons Area -->
      <div class="w-full flex flex-col gap-3">
        <!-- Primary Action Button: "Masuk" (Dark, 48px height) -->
        <button type="button" class="w-full h-12 rounded-xl bg-[#1C1C1C] hover:bg-[#2b2b2b] active:scale-[0.99] text-[#FAF8F5] font-semibold text-[15px] tracking-wide shadow-md transition-all flex items-center justify-center gap-2 border border-[#1C1C1C]">

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>

          Lanjut sebagai tamu
        </a>
        
        <!-- Subtle verification badge footer -->
        <div class="mt-3 flex items-center justify-center gap-2 text-[11px] text-[#A39E98] uppercase tracking-widest">
          <span>Keaslian Terjamin</span>
          <span class="inline-block w-1 h-1 rounded-full bg-[#C9A227]"></span>
          <span>Sertifikat Digital</span>
        </div>
      </div>

    </div>

  </main>
